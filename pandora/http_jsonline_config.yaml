# =============================================================================
# Pandora Config: HTTP jsonline ammo without scenario HCL
# Запуск: pandora http_jsonline_config.yaml
# =============================================================================

pools:
  - id: http-jsonline-pool
    gun:
      type: http
      target: 127.0.0.1:8080
    ammo:
      type: http/json
      file: ammo/http_jsonline.jsonl

    result:
      type: phout
      destination: ./results/http_jsonline_phout.log

    discard_overflow: true

    rps:
      - type: line
        from: 1
        to: 50
        duration: 60s
      - type: const
        ops: 50
        duration: 120s

    startup:
      type: once
      times: 50

log:
  level: info

monitoring:
  expvar:
    enabled: true
    port: 1244
